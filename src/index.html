<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tronix Launcher</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <header class="bar">
      <span class="logo" role="img" aria-label="Tronix"></span>
      <div class="actions" id="header-actions">
        <button class="btn ghost" id="import">Importer</button>
        <button class="btn ghost" id="add">+ Ajouter</button>
        <button class="btn icon" id="stats" aria-label="Statistiques" title="Statistiques">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 20V11M12 20V5M19 20v-7" />
          </svg>
        </button>        <button class="btn icon" id="settings" aria-label="Paramètres" title="Paramètres">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
            <circle cx="16" cy="7" r="2" />
            <circle cx="8" cy="17" r="2" />
          </svg>
        </button>
      </div>
    </header>

    <main id="view"></main>
    <div id="overlay" class="overlay" hidden></div>
    <div id="toast" class="toast" role="status"></div>
  </body>
</html>
